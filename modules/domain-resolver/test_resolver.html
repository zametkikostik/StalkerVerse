<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Domain Resolver Test</title>
  <style>
    body { font-family: system-ui; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #0f1115; color: #eee; }
    input, button { font-size: 16px; padding: 8px 12px; margin: 4px 0; }
    input { width: 70%; }
    pre { background: #1a1d24; padding: 12px; border-radius: 8px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Web3 Domain Resolver</h1>
  <input id="q" placeholder="vitalik.eth" value="vitalik.eth" />
  <button id="go">Resolve</button>
  <pre id="out">—</pre>
  <script src="resolver.js"></script>
  <script>
    document.getElementById('go').onclick = async () => {
      const name = document.getElementById('q').value.trim();
      const out = document.getElementById('out');
      out.textContent = 'Resolving…';
      try {
        const r = window.__WEB3_DOMAIN_RESOLVER__;
        if (!r) throw new Error('resolver not loaded');
        const result = await r.resolve(name);
        out.textContent = JSON.stringify(result, null, 2);
      } catch (e) {
        out.textContent = 'Error: ' + e.message;
      }
    };
  </script>
</body>
</html>
