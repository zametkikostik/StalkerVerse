name: Android Debug APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Create local.properties
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Placeholder Project ID — replace via repo secret REOWN_PROJECT_ID for real WC
          echo "reown.project.id=${{ secrets.REOWN_PROJECT_ID || 'github-actions-placeholder' }}" >> local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew missing — generating wrapper"
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web3-browser-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          echo "### Debug APK built" >> $GITHUB_STEP_SUMMARY
          ls -lh android/app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY || true
