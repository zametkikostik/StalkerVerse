name: Android Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Create local.properties
        working-directory: android
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$REOWN_PROJECT_ID" ]; then
            echo "reown.project.id=$REOWN_PROJECT_ID" >> local.properties
          else
            echo "reown.project.id=github-actions-placeholder" >> local.properties
            echo "::warning::REOWN_PROJECT_ID secret not set — WalletConnect will use placeholder"
          fi

      - name: Ensure Gradle Wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            echo "Installing Gradle to generate wrapper…"
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web3-browser-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Android debug build"
            echo ""
            if [ -d android/app/build/outputs/apk/debug ]; then
              echo "APK:"
              ls -lh android/app/build/outputs/apk/debug/
            else
              echo "No APK directory (build may have failed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
