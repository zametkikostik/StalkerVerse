name: names-ci

on:
  push:
    branches: [main]
    paths:
      - "src/lib/**"
      - "package.json"
      - ".github/workflows/names-ci.yml"
  pull_request:
    paths:
      - "src/lib/**"
      - "package.json"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run names tests
        run: |
          node --experimental-strip-types --test \
            src/lib/names/detector.test.ts \
            src/lib/names/ens.test.ts \
            src/lib/names/hns.test.ts
